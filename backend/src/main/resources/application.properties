# ===================================================================
# Sango Fiora Backend - Railway Production Configuration
# ===================================================================

# Server
server.port=${PORT:8080}

# Multipart Uploads (Product Images)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# -------------------------------------------------------------------
# Database (PostgreSQL on Railway) - REQUIRES env vars in production
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:sangofiora;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000

# -------------------------------------------------------------------
# JPA / Hibernate
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# -------------------------------------------------------------------
# Flyway Migrations (runs when PostgreSQL is enabled)
# -------------------------------------------------------------------
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# -------------------------------------------------------------------
# Jackson / Serialization
# -------------------------------------------------------------------
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=Asia/Kolkata

# -------------------------------------------------------------------
# Actuator / Health / Metrics / Prometheus
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=sangofiora-backend
management.metrics.export.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true

# -------------------------------------------------------------------
# CORS (configured in CorsConfig.java - allow all for dev, restrict via env in prod)
# -------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# -------------------------------------------------------------------
# Security / JWT & Admin Configuration
# -------------------------------------------------------------------
app.jwt.issuer=${JWT_ISSUER:https://hyecifzfswwrhsyrrxmw.supabase.co/auth/v1}
app.jwt.audience=${JWT_AUDIENCE:authenticated}
app.admin-emails=${ADMIN_EMAILS:${SANGO_ADMIN_EMAILS:admin@sangofiora.com,kishorevk40@gmail.com}}

# Resend Email Configuration
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
app.resend.from-name=${RESEND_FROM_NAME:Sango Fiora}

# Frontend URL (for email links, CORS, etc.)
app.frontend.url=${FRONTEND_URL:https://sango-storefront-production.up.railway.app}