# ===================================================================
# Sango Fiora Backend - Production-Hardened Configuration
# ===================================================================

# Server
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Multipart Uploads (Product Images)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# -------------------------------------------------------------------
# Database (PostgreSQL on Railway / H2 fallback for local dev)
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:sangofiora;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# HikariCP Connection Pool & Resilient Timeouts
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# -------------------------------------------------------------------
# JPA / Hibernate
# -------------------------------------------------------------------
# Safe DDL mode: in production use validate/none; Flyway executes all migrations
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Flyway Migrations
# -------------------------------------------------------------------
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# -------------------------------------------------------------------
# H2 Console (Disabled in production by default)
# -------------------------------------------------------------------
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

# -------------------------------------------------------------------
# Jackson / Serialization
# -------------------------------------------------------------------
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=Asia/Kolkata

# -------------------------------------------------------------------
# Actuator / Health / Metrics / Prometheus
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=sangofiora-backend
management.metrics.export.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true

# -------------------------------------------------------------------
# CORS (Strictly whitelisted production origins)
# -------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://sango-storefront-production.up.railway.app,https://sangofiora.com,https://www.sangofiora.com,http://localhost:8080,http://localhost:3000}

# -------------------------------------------------------------------
# Security / JWT & Admin Configuration
# -------------------------------------------------------------------
app.jwt.issuer=${JWT_ISSUER:https://hyecifzfswwrhsyrrxmw.supabase.co/auth/v1}
app.jwt.audience=${JWT_AUDIENCE:authenticated}
app.jwt.secret=${JWT_SECRET:${SUPABASE_JWT_SECRET:}}
app.jwt.jwks-url=${JWT_JWKS_URL:${JWT_ISSUER:https://hyecifzfswwrhsyrrxmw.supabase.co/auth/v1}/.well-known/jwks.json}
app.admin-emails=${ADMIN_EMAILS:${SANGO_ADMIN_EMAILS:admin@sangofiora.com,kishorevk40@gmail.com}}

# -------------------------------------------------------------------
# Payment & Stripe Secrets (Must be supplied via Environment Variables)
# -------------------------------------------------------------------
app.payment.secret=${PAYMENT_SECRET:}
app.payment.merchant-vpa=${MERCHANT_VPA:pay@sangofiora}
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# -------------------------------------------------------------------
# Resend Email Configuration
# -------------------------------------------------------------------
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from-email=${RESEND_FROM_EMAIL:orders@sangofiora.com}
app.resend.from-name=${RESEND_FROM_NAME:Sango Fiora}

# Frontend URL
app.frontend.url=${FRONTEND_URL:https://sango-storefront-production.up.railway.app}

# File Upload Directory
app.upload.dir=${UPLOAD_DIR:uploads/plants}

# -------------------------------------------------------------------
# NVIDIA NIM AI Assistant Configuration (Key via Environment Variable)
# -------------------------------------------------------------------
app.nvidia.api-key=${NVIDIA_API_KEY:}
app.nvidia.model=${NVIDIA_MODEL:nvidia/nemotron-3.5-bolt-e4b}
app.nvidia.api-url=${NVIDIA_API_URL:https://integrate.api.nvidia.com/v1/chat/completions}
