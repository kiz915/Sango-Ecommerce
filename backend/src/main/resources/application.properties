server.port=${PORT:8080}

# Database - REQUIRES env var in production
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:sangofiora;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (dev only)
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Jackson
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=Asia/Kolkata

# App config
app.payment.secret=${PAYMENT_SECRET:}
app.payment.merchant-vpa=${PAYMENT_MERCHANT_VPA:pay@sangofiora}
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.google-sheets.webhook-url=${GOOGLE_SHEETS_WEBHOOK_URL:}
app.admin.emails=${ADMIN_EMAILS:kishorevk40@gmail.com,shamnaraja07@gmail.com}
