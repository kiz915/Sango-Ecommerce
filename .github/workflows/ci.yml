name: CI & Security Quality Gate
on: [push, pull_request]

jobs:
  security-audit:
    name: Security & Secret Leak Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify No Tracked .env or Secrets
        run: |
          if git ls-files | grep -E "(^|/)\.env$"; then
            echo "::error::Direct .env file detected in git tracking! Untrack before merging."
            exit 1
          fi
          echo "Secret exposure check passed: no tracked .env files."

  backend:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x backend/mvnw

      - name: Run Maven Tests & Package
        run: cd backend && ./mvnw test -B

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Storefront
        run: npm run build
