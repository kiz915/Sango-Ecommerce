<!-- Sango Fiora Botanical AI Assistant Widget -->
<div id="sango-chatbot-root" class="fixed bottom-5 right-5 z-50 flex flex-col items-end gap-3 font-sans">
  <!-- Chat Window -->
  <section id="sango-chat-panel"
    aria-label="Sango Fiora Botanical Assistant"
    class="hidden w-[calc(100vw-2.5rem)] sm:w-[380px] max-h-[540px] flex flex-col rounded-2xl border border-[#1B4332]/15 bg-[#FDFBF7] shadow-2xl overflow-hidden transition-all duration-200">
    <!-- Header -->
    <div class="flex items-center justify-between px-4 py-3.5 bg-[#1B4332] text-white">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-full bg-white/15 border border-white/20 flex items-center justify-center shrink-0">
          <span class="material-symbols-outlined text-[20px] text-[#FDE68A]">eco</span>
        </div>
        <div>
          <h2 class="font-serif text-sm font-bold tracking-wide leading-tight">Flora · Sango AI</h2>
          <p class="text-[11px] text-emerald-100/85 flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block"></span>
            Live Store &amp; Order Assistant
          </p>
        </div>
      </div>
      <div class="flex items-center gap-1">
        <button id="sango-chat-reset" type="button" title="New chat"
          class="p-1.5 rounded-lg text-white/80 hover:text-white hover:bg-white/10 transition-colors cursor-pointer">
          <span class="material-symbols-outlined text-[18px]">refresh</span>
        </button>
        <button id="sango-chat-close" type="button" title="Close assistant"
          class="p-1.5 rounded-lg text-white/80 hover:text-white hover:bg-white/10 transition-colors cursor-pointer">
          <span class="material-symbols-outlined text-[20px]">close</span>
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div id="sango-chat-messages"
      class="flex-1 overflow-y-auto px-4 py-3.5 space-y-3 text-[13px] leading-relaxed bg-[#FAF7F0]">
    </div>

    <!-- Dynamic Quick Suggestions -->
    <div id="sango-chat-suggestions"
      class="px-3.5 py-2 bg-[#FAF7F0] border-t border-[#1B4332]/10 flex flex-wrap gap-1.5 empty:hidden">
    </div>

    <!-- Input Form -->
    <form id="sango-chat-form" class="p-3 bg-white border-t border-[#1B4332]/10 flex items-center gap-2">
      <input id="sango-chat-input" type="text" maxlength="1000" autocomplete="off"
        placeholder="Ask about plants, prices, promos, orders..."
        class="flex-1 px-3.5 py-2 text-[13px] rounded-xl border border-[#1B4332]/20 bg-[#FDFBF7] text-gray-800 placeholder:text-gray-400 focus:outline-none focus:border-[#1B4332] focus:ring-1 focus:ring-[#1B4332]" />
      <button id="sango-chat-send" type="submit" aria-label="Send message"
        class="w-9 h-9 rounded-xl bg-[#1B4332] text-white flex items-center justify-center hover:bg-[#143326] active:scale-95 transition-all disabled:opacity-50 cursor-pointer shrink-0">
        <span class="material-symbols-outlined text-[18px]">send</span>
      </button>
    </form>
  </section>

  <!-- Floating Toggle Button -->
  <button id="sango-chat-toggle" type="button" aria-label="Open Sango AI Assistant"
    class="group flex items-center gap-2.5 pl-4 pr-4 py-3 rounded-full bg-[#1B4332] text-white shadow-xl border border-white/15 hover:bg-[#143326] hover:scale-[1.02] active:scale-95 transition-all cursor-pointer">
    <span class="material-symbols-outlined text-[20px] text-[#FDE68A]">smart_toy</span>
    <span class="text-xs font-semibold tracking-wide hidden sm:inline">Ask Flora AI</span>
  </button>
</div>
